# Aplica a data/ una accion firmada con cartera.
#
# Los datos del evento solo entran por `env:`. Nunca escribir expresiones del
# evento dentro de `run:`: permitiria ejecutar comandos desde el payload.
# Sin `concurrency`: GitHub descartaria acciones en espera. El orden lo resuelve
# cli.js reintentando sobre el ultimo commit.
name: Accion firmada

on:
  repository_dispatch:
    types: [accion-firmada]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/verificador/package-lock.json
      - name: Instalar verificador
        run: npm ci --ignore-scripts
        working-directory: services/verificador
      - name: Verificar y publicar
        env:
          SOBRE_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name "sorteos-firmas[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node services/verificador/src/cli.js
