name = "sorteos-web3"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "../../apps/web3/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
GITHUB_OWNER = "alicia29304"
GITHUB_REPO = "PlataformasSorteosYRifas"

# Comprobantes de pago: privados, solo se entregan a carteras con permiso sobre la rifa.
[[r2_buckets]]
binding = "COMPROBANTES"
bucket_name = "sorteos-web3-comprobantes"
